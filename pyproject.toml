[project]
name = "relecture"
version = "0.1.0"
description = "Audience-adaptive lecture re-narration with voice cloning"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "numpy>=2.2.6",
    "openai>=2.7.2",
    "opencv-python>=4.11.0.86",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.0",
    "scikit-image>=0.25.0",
    "jiwer>=0.6.0",
    "gradio>=4.0",
]

[project.optional-dependencies]
eval = ["resemblyzer", "speechmos", "soundfile", "jiwer>=3.0"]

[project.scripts]
relecture = "relecture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
