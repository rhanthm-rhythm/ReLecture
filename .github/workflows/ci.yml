name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m unittest discover tests -v
        # Tests that require live GPU servers (tests/servers/) skip automatically
        # when the services are not running — no special exclusion needed.

      - name: Verify CLI entry point
        run: uv run relecture --help
